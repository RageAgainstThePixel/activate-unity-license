name: build
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
    secrets:
      UNITY_USERNAME:
        required: true
      UNITY_PASSWORD:
        required: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # a hung editor or licensing call must not hold the matrix
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: RageAgainstThePixel/unity-setup@dev/v3.0.0 # until unity-setup v3 is tagged
        with:
          version-file: None
          unity-version: ${{ matrix.unity-version }}
          build-targets: ${{ matrix.build-target }}
      # every row signs in and activates on its own OS and editor; the post step returns the license on Windows only
      - uses: ./ # RageAgainstThePixel/activate-unity-license
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - uses: RageAgainstThePixel/unity-action@v3
        timeout-minutes: 10
        with:
          args: -quit -nographics -createProject "${{ github.workspace }}/Test Project"
