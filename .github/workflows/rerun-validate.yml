name: rerun-validate
# workflow_run only fires for workflow files on the default branch, so this starts working once it is merged to main
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: write
      checks: read
    uses: RageAgainstThePixel/unity-cli/.github/workflows/rerun-marked-failures.yml@v4.0.0 # no floating v4 tag yet
    with:
      run-id: ${{ github.event.workflow_run.id }}
      run-attempt: ${{ github.event.workflow_run.run_attempt }}
